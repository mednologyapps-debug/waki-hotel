name: WAKI hotel - validate and publish
on:
  push:
    branches: [main, codex/affiliation-dossier-20261105]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: waki-hotel-publish
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:operations
      - run: npm run test:availability
      - name: Verify fixed-sidebar layout does not double offset pages
        run: node --test tests/hotel-layout-regression.test.mjs
      - run: npm run lint
      - name: Build with public WAKI client configuration
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ipakrrcjrpfcnjvtwhvp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_foN1DcV6ZvwM21hcrv6uGw_B12PC99o
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Record build version
        run: |
          printf '{"source_commit":"%s","built_at":"%s","publication_branch":"deploy/hotel","format":"vite-static"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          test -s dist/index.html
          test -s dist/.htaccess
          test -s dist/version.json
      - name: Checkout Hostinger publication branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: deploy/hotel
          path: site
          persist-credentials: true
      - name: Publish versioned static build (no force push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rsync -av --delete --exclude='.git/' dist/ site/
          git -C site config user.name "WAKI CI"
          git -C site config user.email "ci@users.noreply.github.com"
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "No publication changes"
          else
            git -C site commit -m "Publish hotel from ${GITHUB_SHA}"
            git -C site push origin HEAD:deploy/hotel
          fi
